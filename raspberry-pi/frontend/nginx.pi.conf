server {
    listen 80;
    server_name localhost;

    # 樹莓派前端靜態檔案的部署路徑
    location / {
        root /var/www/aoi-frontend;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 將 API 請求轉導至後端
    location /api {
        # 【配置提示】：
        # 1. 如果您的後端是「原生本機部署」（Native FastAPI），請使用 127.0.0.1:8000 (預設)
        # 2. 如果您的後端仍是「Docker 容器部署」，請改為 127.0.0.1:8001 (Docker 對外對應埠)
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 支援 WebSocket（如果未來相機串流或控制需要 WS）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 將後端產生的檢測歷史與擷取圖片轉導至 FastAPI StaticFiles
    location /data/history {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
