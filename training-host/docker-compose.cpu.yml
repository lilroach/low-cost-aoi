version: '3.8'

services:
  # CPU/GPU selection now belongs to the terminal backend Python environment.
  # This compose file intentionally does not start a backend container.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aoi-frontend
    ports:
      - "3000:80"

  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: aoi-label-studio
    ports:
      - "8080:8080"
    volumes:
      - ./data:/label-studio/data
      - ./data/raw:/label-studio/files
    environment:
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=/label-studio/files
      - LABEL_STUDIO_USERNAME=admin@aoi.com
      - LABEL_STUDIO_PASSWORD=password123
      - LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK=true
    command: label-studio start
